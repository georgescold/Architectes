ial,sans-serif" font-size="44" fill="#68707c"><tspan x="140" y="16161.8">Ensuite : votre Instagram plaît… mais reçoit-il des projets ?</tspan></text><g id="ink"></g></svg><div id="hint">ESSORT / TABLEAU CONTINU · glisser pour déplacer · molette pour parcourir · Ctrl + molette pour zoomer</div><div id="toolbar"><button onclick="go(index-1)">←</button><button onclick="go(index+1)">→</button><button onclick="chapters()">Repères</button><button onclick="overview()">Vue globale</button><button onclick="zoom(.8)">+</button><button onclick="zoom(1.25)">−</button><button id="pen" onclick="pen()">Stylet D</button><button onclick="undo()">Annuler</button><button onclick="showNotes()">Notes N</button><button onclick="record()">Filmer F</button><a href="01-client-professionnel.excalidraw" download>↓ Excalidraw</a></div><aside id="panel" hidden></aside><script>
const data={"marks": [{"title": "Votre prochain client\nn’habite peut-être PAS son projet.", "x": 0, "y": -30, "w": 2400, "h": 1550}, {"title": "Vous dessinez un lieu.\nVotre client cherche autre chose.", "x": 0, "y": 1850, "w": 2400, "h": 1350}, {"title": "« Les professionnels »\nest encore une cible trop large.", "x": 0, "y": 3530, "w": 2400, "h": 1500}, {"title": "La question qui change la conversation :\n« Qu’est-ce qui doit être prêt, et quand ? »", "x": 0, "y": 5360, "w": 2400, "h": 1680}, {"title": "Votre preuve ≠ une liste d’adjectifs.", "x": 0, "y": 7370, "w": 2400, "h": 1490}, {"title": "Le même savoir-faire.\nUn message que le client comprend.", "x": 0, "y": 9190, "w": 2400, "h": 1560}, {"title": "Un message clair ne suffit pas.\nIl faut organiser la suite.", "x": 0, "y": 11080, "w": 2400, "h": 1730}, {"title": "Votre premier test tient en 4 choix.", "x": 0, "y": 13140, "w": 2400, "h": 1300}, {"title": "Faites-vous choisir\npour un problème précis.", "x": 0, "y": 14770, "w": 2400, "h": 1450}], "notes": [{"id": "frame-1", "title": "Votre prochain client n’habite peut-être pas son projet.", "time": "00:00 - 00:45", "notes": ["Un restaurateur qui veut ouvrir dans trois mois et un particulier qui refait son salon peuvent chercher le même talent. Mais ils ne prennent pas leur décision pour les mêmes raisons.", "Si vous êtes architecte d’intérieur, seul ou en petite équipe, et que votre communication montre surtout du résidentiel, cette piste mérite d’être regardée.", "On va voir quelle cible choisir, comment rendre votre valeur évidente et comment tester sans refaire tout votre cabinet."], "gesture": "Commencer face caméra. Afficher la photo, puis révéler « UNE DATE À TENIR ». Marquer une pause.", "transition": "La différence n’est pas seulement le type de bâtiment. C’est la raison pour laquelle le client agit."}, {"id": "frame-2", "title": "Même métier. Deux raisons de vous appeler.", "time": "00:45 - 01:50", "notes": ["Chez un particulier : une façon de vivre, du confort, un lieu dans lequel se reconnaître. Ce sont de vrais enjeux.", "Pour un professionnel : recevoir des clients, organiser le travail, exploiter un espace. Le lieu sert aussi une activité.", "Ce n’est pas forcément un client plus riche ou plus rapide. L’idée utile : parler de l’usage du lieu avant de parler de votre style."], "gesture": "Révéler le particulier, puis le professionnel. Pointer « vivre » et « exercer ».", "transition": "Mais « les professionnels » est encore beaucoup trop large. Il faut choisir qui vous comprenez le mieux."}, {"id": "frame-3", "title": "Choisissez un métier avant de choisir une publicité.", "time": "01:50 - 03:00", "notes": ["Un restaurateur peut se demander comment faire circuler l’équipe et accueillir les clients. Une boutique pense présentation et parcours. Un cabinet de soins pense accueil et confidentialité.", "Choisissez une cible dont vous connaissez les contraintes, accessible dans votre zone et compatible avec vos compétences.", "Exemple : vous avez une expérience pertinente en commerces de proximité. Commencez par cette piste, plutôt que de parler à tout le monde.", "Certains locaux reçoivent du public : sécurité, accessibilité et autorisations demandent une compétence adaptée. Un beau portfolio résidentiel ne suffit pas à prouver cette maîtrise."], "gesture": "Faire apparaître les trois cartes. Entourer RESTAURANT au stylet comme choix d’exemple.", "transition": "Une fois la cible choisie, cherchez la question qui fait vraiment avancer son projet."}, {"id": "frame-4", "title": "Une date donne du sens aux décisions.", "time": "03:00 - 04:05", "notes": ["Prenons un cas fictif : un restaurateur vise une ouverture dans trois mois. Ce délai est un souhait à étudier, pas une promesse que vous pouvez reprendre sans vérification.", "Votre rôle est de rendre visibles les dépendances : état du local, autorisations, choix, coordination et travaux.", "La question de départ devient : qu’est-ce qui doit être décidé, par qui, et dans quel ordre pour construire un calendrier réaliste ?", "L’esthétique reste importante. Vous montrez simplement que votre travail aide aussi à prendre de meilleures décisions."], "gesture": "Afficher la date, puis les trois étapes de gauche à droite. Pointer le point de blocage « autorisations ».", "transition": "Et si vous n’avez jamais livré un restaurant ? Voici ce que vous pouvez montrer honnêtement."}, {"id": "frame-5", "title": "Pas de référence identique ? Montrez la preuve utile.", "time": "04:05 - 05:10", "notes": ["Ne faites pas passer un appartement pour une référence de restaurant. Cherchez les compétences réellement transférables : circulation, matériaux, coordination, contraintes de chantier.", "Expliquez un cas avec trois éléments : la contrainte, ce que vous avez décidé et le résultat observable. Utilisez uniquement des images que vous avez le droit de montrer.", "Pour les compétences spécifiques qui vous manquent, identifiez un partenaire qualifié ou une formation. La communication rend une compétence visible ; elle ne la crée pas.", "C’est plus rassurant qu’une longue liste d’adjectifs comme “passionné”, “créatif”, “sur mesure”."], "gesture": "Révéler les trois blocs. Ajouter oralement un cas réel du cabinet, sans inventer de résultat client.", "transition": "Maintenant, mettons cette preuve dans un message que le professionnel comprend immédiatement."}, {"id": "frame-6", "title": "Passez du beau discours à une situation précise.", "time": "05:10 - 06:15", "notes": ["“Des espaces qui vous ressemblent” peut être sincère, mais ne dit ni à qui vous parlez ni quel problème vous résolvez.", "“Vous ouvrez un restaurant à Lyon ? Pensons un lieu accueillant et adapté au service.” On comprend la personne, la situation et l’usage. Lyon n’est qu’un exemple.", "Sous cette phrase : une réalisation autorisée, la contrainte résolue, votre mission et une façon simple de parler du projet.", "Évitez les dates garanties, la hausse de chiffre d’affaires promise ou les compétences que vous ne possédez pas. La précision est déjà persuasive."], "gesture": "Garder le message précis masqué. Demander « Qui est concerné ? ». Révéler la deuxième carte et les trois repères.", "transition": "Une bonne phrase ne trouve pas les clients toute seule. Il lui faut une porte d’entrée."}, {"id": "frame-7", "title": "Reliez votre message à une vraie conversation.", "time": "06:15 - 07:35", "notes": ["Premier chemin : votre réseau. Identifiez les personnes qui rencontrent déjà ces porteurs de projet : agents de locaux commerciaux, partenaires, contacts professionnels. Une relation se construit ; elle n’est pas garantie.", "Autre option : une publicité locale sur Facebook ou Instagram, avec un message et des images qui parlent à la cible. Le ciblage ne garantit pas de toucher uniquement des dirigeants ou des projets prêts à démarrer.", "La personne arrive sur une page claire ou sur un formulaire intégré à la publicité. On lui demande la nature du projet, la zone, le calendrier et une enveloppe indicative, puis on échange.", "Le chiffre à suivre, ce sont les conversations pertinentes puis les missions signées. Un formulaire rempli ne suffit pas.", "Si c’est la partie qui vous semble difficile à relier, envoyez-nous votre type de projet et votre zone sur Instagram. On pourra regarder avec vous par quoi commencer."], "gesture": "Révéler chaque étape. Tracer le parcours avec le pointeur. Le CTA se dit une seule fois, sans interrompre l’explication.", "transition": "Pour éviter de lancer cinq chantiers marketing à la fois, voici le premier test à préparer."}, {"id": "frame-8", "title": "Préparez un test. Pas une refonte complète.", "time": "07:35 - 08:40", "notes": ["Première décision : une cible précise dans une zone que vous pouvez servir. Deuxième : un cas ou une preuve de compétence que vous pouvez présenter honnêtement.", "Troisième : une page ou un profil dont le message et la prise de contact sont clairs. Quatrième : un canal que vous avez les moyens de suivre.", "Avant de dépenser, définissez ce qu’est une demande pertinente et qui la rappelle. Fixez votre budget, une période d’observation et votre critère de poursuite.", "Vous cherchez à apprendre : est-ce que le message attire les bons projets ? Si rien n’est qualifié, revenez au message, à la diffusion et au traitement des demandes avant d’augmenter le budget."], "gesture": "Révéler les quatre choix et les cocher au stylet. Laisser quelques secondes pour une capture.", "transition": "Le but n’est pas de changer de métier. C’est de rendre une partie de votre valeur visible aux bonnes personnes."}, {"id": "frame-9", "title": "Faites-vous choisir pour un problème précis.", "time": "08:40 - 09:20", "notes": ["Le client professionnel n’est pas une solution magique. Mais il peut devenir une piste cohérente si vous connaissez son activité, prouvez votre compétence et organisez la prise de contact.", "Le guide gratuit rassemble les autres leviers d’acquisition : il est indiqué en description, une fois le lien de téléchargement vérifié.", "Si vous voulez regarder votre situation avec nous, écrivez-nous sur @essort.architectes. On parlera de vos projets recherchés, de votre zone et de ce qui bloque aujourd’hui.", "Et si votre compte Instagram montre déjà de beaux projets mais ne déclenche pas de messages, c’est exactement le sujet de l’épisode 05."], "gesture": "Revenir face caméra pour l’invitation. Garder le dernier écran 8 à 12 secondes au montage.", "transition": "Fin. Ajouter le lien de l’épisode 05 à l’écran de fin seulement lorsqu’il est publié."}]},marks=data.marks,board=document.getElementById('board'),panel=document.getElementById('panel');let index=0,v={x:0,y:0,w:2400,h:1500},drawing=false,drag=null,anim=0;const ratio=()=>innerWidth/innerHeight;function set(){board.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`)}function fit(b){b={...b,y:b.y-65,h:b.h+195};let w=Math.max(b.w,b.h*ratio()),h=w/ratio();return{x:b.x-(w-b.w)/2,y:b.y-(h-b.h)/2,w,h}}function move(to,smooth=true){cancelAnimationFrame(anim);const start={...v},t0=performance.now();function tick(t){let p=Math.min(1,(t-t0)/600);p=1-Math.pow(1-p,3);for(const k of ['x','y','w','h'])v[k]=start[k]+(to[k]-start[k])*p;set();if(p<1)anim=requestAnimationFrame(tick)}if(smooth)anim=requestAnimationFrame(tick);else{v=to;set()}}function go(n){index=Math.max(0,Math.min(8,n));move(fit(marks[index]));panel.hidden=true}function overview(){move(fit({x:0,y:0,w:2400,h:marks[8].y+marks[8].h+90}))}function zoom(f){const w=v.w*f,h=v.h*f;move({x:v.x+(v.w-w)/2,y:v.y+(v.h-h)/2,w,h},false)}function point(e){const r=board.getBoundingClientRect();return{x:v.x+(e.clientX-r.left)*v.w/r.width,y:v.y+(e.clientY-r.top)*v.h/r.height}}function pen(){drawing=!drawing;board.classList.toggle('pen',drawing);document.getElementById('pen').classList.toggle('active',drawing)}function undo(){document.getElementById('ink').lastElementChild?.remove()}function chapters(){panel.hidden=false;panel.innerHTML='<h3>Repères dans le tableau</h3>'+marks.map((b,i)=>`<p><button onclick="go(${i})">${i+1}. ${b.title.replaceAll('\n',' ')}</button></p>`).join('')}function showNotes(){if(!panel.hidden){panel.hidden=true;return}let mid=v.y+v.h/2;index=marks.reduce((best,b,i)=>Math.abs(b.y+b.h/2-mid)<Math.abs(marks[best].y+marks[best].h/2-mid)?i:best,0);const n=data.notes[index];panel.hidden=false;panel.innerHTML='<h3>'+marks[index].title+'</h3><ul>'+n.notes.map(t=>'<li>'+t+'</li>').join('')+'</ul><p><b>Transition :</b> '+n.transition+'</p>'}async function record(){document.body.classList.toggle('record');if(document.body.classList.contains('record')){panel.hidden=true;try{await document.documentElement.requestFullscreen()}catch{}}else if(document.fullscreenElement)await document.exitFullscreen()}board.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);if(e.ctrlKey||e.metaKey){const p=point(e),f=Math.exp(e.deltaY*.002);v.x=p.x+(v.x-p.x)*f;v.y=p.y+(v.y-p.y)*f;v.w*=f;v.h*=f}else{v.y+=e.deltaY*v.h/innerHeight;v.x+=e.deltaX*v.w/innerWidth}set()},{passive:false});board.onpointerdown=e=>{cancelAnimationFrame(anim);const p=point(e);board.setPointerCapture(e.pointerId);if(drawing){const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${p.x} ${p.y}`);path.setAttribute('fill','none');path.setAttribute('stroke','#d65c51');path.setAttribute('stroke-width',v.w/260);path.setAttribute('stroke-linecap','round');document.getElementById('ink').appendChild(path);drag={path}}else drag={x:e.clientX,y:e.clientY,v:{...v}}};board.onpointermove=e=>{if(!drag)return;if(drag.path){const p=point(e);drag.path.setAttribute('d',drag.path.getAttribute('d')+` L${p.x} ${p.y}`)}else{v.x=drag.v.x-(e.clientX-drag.x)*v.w/innerWidth;v.y=drag.v.y-(e.clientY-drag.y)*v.h/innerHeight;set()}};board.onpointerup=()=>drag=null;board.onpointercancel=()=>drag=null;addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(index+1);else if(e.key==='ArrowLeft')go(index-1);else if(/^[1-9]$/.test(e.key))go(+e.key-1);else if(e.key==='0')overview();else if(e.key.toLowerCase()==='d')pen();else if(e.key.toLowerCase()==='n')showNotes();else if(e.key.toLowerCase()==='f')record();else if(e.key==='Escape'){document.body.classList.remove('record');panel.hidden=true}else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}});addEventListener('resize',()=>{v.h=v.w/ratio();set()});document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('record')});move(fit(marks[0]),false);
</script></html>
