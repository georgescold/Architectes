<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Essort — Présentation</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f4f0;font-family:system-ui,sans-serif}
    .player{position:relative;width:min(100%,1280px);aspect-ratio:16/9;overflow:hidden;border-radius:16px;background:#18232f;box-shadow:0 18px 60px #18232f20}
    video{display:block;width:100%;height:100%;object-fit:contain}
    .start{position:absolute;inset:0;display:grid;place-items:center;border:0;background:transparent;cursor:pointer}
    .start[hidden]{display:none}.start span{width:88px;height:88px;display:grid;place-items:center;border-radius:50%;background:#ffffffed;box-shadow:0 6px 30px #0004;transition:transform .18s ease,background .18s ease}
    .start:hover span{transform:scale(1.06);background:#fff}.start:focus-visible{outline:4px solid #fff;outline-offset:-8px}.start svg{width:32px;height:32px;margin-left:6px;fill:#263450}
    @media(max-width:600px){body{padding:10px}.player{border-radius:10px}.start span{width:66px;height:66px}.start svg{width:25px;height:25px}}
    @media(prefers-reduced-motion:reduce){.start span{transition:none}}
  </style>
</head>
<body>
  <main class="player" aria-label="Présentation Essort">
    <video id="vsl" controls playsinline preload="none" poster="couverture-vsl.jpg" aria-label="Vidéo de présentation Essort">
      <source src="VSL_Essort_V11.mp4" type="video/mp4">
      <a href="VSL_Essort_V11.mp4">Lire la vidéo Essort</a>
    </video>
    <button class="start" id="start" type="button" aria-label="Lire la vidéo Essort" hidden><span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 3v26l23-13z"/></svg></span></button>
  </main>
  <script>
    const video=document.getElementById('vsl'),button=document.getElementById('start');
    video.controls=false;button.hidden=false;
    button.addEventListener('click',async()=>{button.hidden=true;video.controls=true;try{await video.play();video.focus()}catch{video.controls=false;button.hidden=false}});
    video.addEventListener('play',()=>{button.hidden=true;video.controls=true});
  </script>
</body>
</html>
